<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102c34">
  <title>{% block title %}QR Attendance{% endblock %}</title>
  <meta name="description" content="Register students, print QR cards, and manage daily attendance with an ESP32-CAM scanner.">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% block layout %}
  <main id="main" class="page-container">
    {% for message in get_flashed_messages() %}<p class="notice no-print" role="status">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
</body>
</html>
